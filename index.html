<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Added for mobile responsiveness -->
  <title>Library Manager</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <h1>📚 My Library</h1>
    <p class="subtitle">Smart Book Management System</p>

    <!-- Sidebar for Category Filters -->
    <div class="sidebar">
      <h3>Filter by Category</h3>
      <div class="category-filters">
        <label><input type="checkbox" value="Self-Help" checked onchange="filterByCategory()"> Self-Help</label>
        <label><input type="checkbox" value="Fiction" checked onchange="filterByCategory()"> Fiction</label>
        <label><input type="checkbox" value="Science" checked onchange="filterByCategory()"> Science</label>
        <label><input type="checkbox" value="Math" checked onchange="filterByCategory()"> Math</label>
        <label><input type="checkbox" value="Languages" checked onchange="filterByCategory()"> Languages</label>
        <label><input type="checkbox" value="Journals" checked onchange="filterByCategory()"> Journals</label>
        <label><input type="checkbox" value="Biography" checked onchange="filterByCategory()"> Biography</label>
        <label><input type="checkbox" value="Business" checked onchange="filterByCategory()"> Business</label>
      </div>
      <button class="reset-btn" onclick="resetToDefaults()">Reset to Defaults</button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Add Book -->
      <div class="card add-card">
        <input type="text" id="title" placeholder="Book Title" aria-label="Book Title">
        <input type="text" id="author" placeholder="Author Name" aria-label="Author Name">
        <select id="category" aria-label="Category">
          <option value="Self-Help">Self-Help</option>
          <option value="Fiction">Fiction</option>
          <option value="Science">Science</option>
          <option value="Math">Math</option>
          <option value="Languages">Languages</option>
          <option value="Journals">Journals</option>
          <option value="Biography">Biography</option>
          <option value="Business">Business</option>
        </select>
        <button onclick="addBook()">➕ Add Book</button>
      </div>

      <!-- Search -->
      <div class="card search-card">
        <input type="text" id="searchBox" placeholder="🔍 Search book, author, or category..." onkeyup="searchBooks()" aria-label="Search">
        <button onclick="clearSearch()">Clear Search</button>
      </div>

      <!-- Books Grid -->
      <div id="bookList" class="grid"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
